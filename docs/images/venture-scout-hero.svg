    <circle cx="1089" cy="178" r="7" fill="#1db99b"/><text x="1107" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#18324c">Company announcement</text>
    <circle cx="1089" cy="204" r="7" fill="#d7a33d"/><text x="1107" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#52677f">News article · needs review</text>
    <rect x="1060" y="260" width="292" height="104" rx="16" fill="#f7faff"/>
    <text x="1082" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#58708c">RESEARCH OUTPUT</text>
