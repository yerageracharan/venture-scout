  <path d="M1036 180h19m0 0-7-7m7 7-7 7M1206 239v17m0 0-7-7m7 7 7-7" stroke="#67d7c8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
