    <path d="M1092 327h23m-23 6h23m-23 6h16" stroke="#54708b" stroke-width="2" stroke-linecap="round"/>
    <text x="1137" y="329" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#18324c">Diligence memo</text><text x="1137" y="347" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#72859a">Sources · risks · open questions</text>
