<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
  <title id="title">Venture Scout — evidence-first startup research</title>
  <desc id="desc">A dark navy banner showing startup discovery, source verification, a diligence scorecard and an investment memo connected in a research workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081426"/><stop offset="1" stop-color="#132c49"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#48d6c5"/><stop offset="1" stop-color="#5d8cff"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8fb7d7" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1440" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="1270" cy="-30" r="260" fill="#4386ff" opacity=".08"/>
  <circle cx="1120" cy="430" r="220" fill="#48d6c5" opacity=".08"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="78" y="72" width="164" height="34" rx="17" fill="#48d6c5" fill-opacity=".14" stroke="#48d6c5" stroke-opacity=".45"/>
    <text x="160" y="94" font-size="13" font-weight="700" letter-spacing="2.4" text-anchor="middle" fill="#83eee0">OPEN-SOURCE RESEARCH TOOL</text>
    <text x="78" y="184" font-size="64" font-weight="800" letter-spacing="-2.5" fill="#f4f8ff">VENTURE SCOUT</text>
    <text x="81" y="238" font-size="25" font-weight="500" fill="#c6d6e8">Find startups. Verify the evidence.</text>
    <text x="81" y="275" font-size="25" font-weight="500" fill="#c6d6e8">Understand the risk before the story.</text>
    <text x="81" y="350" font-size="16" fill="#92a9c2">A transparent seed-stage research workspace + reusable AI agent skill.</text>
    <g transform="translate(82 385)">
      <circle cx="7" cy="0" r="5" fill="#48d6c5"/><text x="22" y="5" font-size="14" fill="#bed0e2">Discover</text>
      <circle cx="132" cy="0" r="5" fill="#48d6c5"/><text x="147" y="5" font-size="14" fill="#bed0e2">Verify</text>
      <circle cx="235" cy="0" r="5" fill="#48d6c5"/><text x="250" y="5" font-size="14" fill="#bed0e2">Score</text>
      <circle cx="337" cy="0" r="5" fill="#48d6c5"/><text x="352" y="5" font-size="14" fill="#bed0e2">Learn</text>
    </g>
  </g>
  <g>
    <rect x="780" y="78" width="255" height="286" rx="18" fill="#f7faff"/>
    <rect x="800" y="98" width="215" height="32" rx="8" fill="#e7eef8"/>
    <circle cx="816" cy="114" r="4" fill="#48bba9"/><circle cx="831" cy="114" r="4" fill="#9db2c9"/><circle cx="846" cy="114" r="4" fill="#9db2c9"/>
    <text x="802" y="160" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#58708c">COMPANY UNIVERSE</text>
    <rect x="802" y="176" width="211" height="42" rx="8" fill="#fff" stroke="#d9e3ef"/>
    <circle cx="824" cy="197" r="9" fill="#d5e9ff"/><text x="842" y="194" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#18324c">Example Startup</text><text x="842" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" fill="#72859a">Seed · AI infrastructure</text>
    <rect x="802" y="226" width="211" height="42" rx="8" fill="#fff" stroke="#d9e3ef"/>
    <circle cx="824" cy="247" r="9" fill="#d8f3eb"/><text x="842" y="244" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#18324c">Candidate Company</text><text x="842" y="258" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" fill="#72859a">Seed · Enterprise software</text>
    <rect x="802" y="282" width="211" height="61" rx="9" fill="#102b46"/>
    <text x="816" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#8ddfd5">EVIDENCE COVERAGE</text>
    <text x="816" y="329" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">72%</text>
